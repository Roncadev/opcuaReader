[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = [
    "BLE001",  # catch Exception troppo generico — usato intenzionalmente
    "SIM102",  # if annidati — preferenza stilistica
    "S110",    # try/except/pass — usato intenzionalmente
    "E722",    # bare except — gestito caso per caso
    "F841",    # variabile assegnata ma non usata — fix unsafe
    "E402",    # import non in cima — necessario dopo sys.path
    "E501",    # linee troppo lunghe — codebase legacy, da rivedere gradualmente
    "E701",    # più statement sulla stessa riga — stile consolidato nel codebase
    "E741",    # nomi variabile brevi — in contesto locale
    "F811",    # ridefinizione metodo — da rivedere separatamente
    "UP031",   # formato % — fix unsafe
    "W293",    # whitespace su righe vuote nei docstring — fix unsafe
]
